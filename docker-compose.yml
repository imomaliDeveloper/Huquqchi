version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: huquqchi_postgres
    restart: always
    environment:
      POSTGRES_USER: huquqchi_user
      POSTGRES_PASSWORD: huquqchi_password
      POSTGRES_DB: huquqchi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    container_name: huquqchi_bot
    restart: always
    depends_on:
      - postgres
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DATABASE_URL: "postgresql://huquqchi_user:huquqchi_password@postgres:5432/huquqchi_db?schema=public"
      NODE_ENV: production

volumes:
  postgres_data:
